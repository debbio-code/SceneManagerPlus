<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Scene Manager+</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <button id="btn-refresh" title="Refresh">&#x21bb;</button>
      <button id="btn-update" title="Update from view">&#x25c9; Update</button>
      <button id="btn-delete" title="Delete selected">&#x2715;</button>
      <div class="spacer"></div>
      <button id="btn-export" title="Export (coming soon)" disabled>&#x21e9;</button>
      <button id="btn-settings" title="Settings (coming soon)" disabled>&#x2699;</button>
    </header>

    <div id="scene-list" class="scene-list" tabindex="0"></div>

    <aside id="props" class="props collapsed">
      <div class="props-header">
        <span id="props-title">No selection</span>
        <button id="props-toggle" title="Toggle properties">&#x25be;</button>
      </div>
      <div class="props-body">
        <label>Name <input type="text" id="prop-name"></label>
        <label>Description <textarea id="prop-desc" rows="2"></textarea></label>
        <fieldset>
          <legend>Properties to save</legend>
          <div id="prop-flags"></div>
        </fieldset>
        <button id="prop-apply">Apply</button>
      </div>
    </aside>

    <footer class="statusbar">
      <span id="status">Ready</span>
    </footer>
  </div>

  <script src="js/bridge.js"></script>
  <script src="js/dnd.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
