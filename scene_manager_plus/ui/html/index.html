<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Scene Manager+</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <button id="btn-refresh" title="Refresh">&#x21bb;</button>
      <button id="btn-new-folder" title="New folder">&#x1F4C1;+</button>
      <button id="btn-update" title="Update from view">&#x25c9;</button>
      <button id="btn-delete" title="Delete selected">&#x2715;</button>
      <button id="btn-defer" title="Defer mode: stage changes in memory, click again to flush all to SketchUp">&#x23F8;</button>
      <button id="btn-previews" title="Generate previews for selected scenes (or all if none selected)">&#x1F3AC;</button>
      <button id="btn-select-all" title="Select all scenes">&#x2611;</button>
      <button id="btn-thumbs" title="Show inline thumbnails in the list">&#x1F5BC;</button>
      <div class="spacer"></div>
      <button id="btn-export" title="Batch export scenes">&#x21e9;</button>
      <button id="btn-settings" title="Settings">&#x2699;</button>
    </header>

    <div id="progress" class="progress hidden">
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      <span id="progress-text" class="progress-text">Generating previews…</span>
      <button id="btn-cancel-export" class="cancel-btn hidden" title="Cancel export">&#x2715;</button>
    </div>

    <div id="scene-list" class="scene-list" tabindex="0">
      <div class="empty-state">Loading…</div>
    </div>

    <footer class="statusbar">
      <span id="status">Ready</span>
    </footer>
  </div>

  <script src="js/bridge.js"></script>
  <script src="js/dnd.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
