<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Style</title>
  <link rel="stylesheet" href="css/style_dialog.css">
  <link rel="stylesheet" href="css/color_popup.css">
</head>
<body>
  <div id="app">
    <header class="hdr">
      <div class="hdr-title">
        <span class="hdr-label">Nickname:</span>
        <input type="text" id="style-nickname" class="hdr-nick-input" placeholder="(none — uses native name)" autocomplete="off" spellcheck="false">
      </div>
      <div class="hdr-title hdr-badgecolor">
        <span class="hdr-label">Badge color:</span>
        <span class="color-control">
          <span id="sw-BadgeColor" class="swatch swatch-clickable" title="Click to pick a color"></span>
          <input type="text" id="ctrl-BadgeColor" class="hex" maxlength="7" placeholder="(none)" autocomplete="off" spellcheck="false">
          <button id="btn-clear-badgecolor" class="badge-clear-btn" title="Clear color">✕</button>
        </span>
      </div>
      <div id="style-native" class="hdr-native">Native: <span id="style-name">—</span></div>
      <div id="scope-note" class="hdr-scope">Applies to all scenes using this style</div>
    </header>

    <section class="group">
      <h3>Edges</h3>
      <label class="row">
        <span class="lbl">Color</span>
        <select id="ctrl-EdgeColorMode" data-key="EdgeColorMode">
          <option value="1">All same</option>
          <option value="0">By material</option>
          <option value="2">By axis</option>
        </select>
      </label>
      <label class="row">
        <span class="lbl">Transparency quality</span>
        <select id="ctrl-TransparencySort" data-key="TransparencySort">
          <option value="0">Faster</option>
          <option value="2">Nicer</option>
        </select>
      </label>
    </section>

    <section class="group">
      <h3>Background</h3>
      <div class="row">
        <span class="lbl">Background color</span>
        <span class="color-control">
          <span id="sw-BackgroundColor" class="swatch swatch-clickable" data-cp-key="BackgroundColor" title="Click to pick a color"></span>
          <input type="text" id="ctrl-BackgroundColor" data-key="BackgroundColor" class="hex" maxlength="7" placeholder="#aabbcc">
        </span>
      </div>
      <label class="row">
        <span class="lbl">Sky</span>
        <input type="checkbox" id="ctrl-DrawHorizon" data-key="DrawHorizon">
      </label>
      <div class="row">
        <span class="lbl">Sky color</span>
        <span class="color-control">
          <span id="sw-SkyColor" class="swatch swatch-clickable" data-cp-key="SkyColor" title="Click to pick a color"></span>
          <input type="text" id="ctrl-SkyColor" data-key="SkyColor" class="hex" maxlength="7" placeholder="#aabbcc">
        </span>
      </div>
    </section>

    <section class="group">
      <h3>Display</h3>
      <label class="row">
        <span class="lbl">X-ray</span>
        <input type="checkbox" id="ctrl-ModelTransparency" data-key="ModelTransparency">
      </label>
      <label class="row">
        <span class="lbl">Hidden geometry</span>
        <input type="checkbox" id="ctrl-DrawHidden" data-key="DrawHidden">
      </label>
      <div class="row">
        <span class="lbl" title="SU 2019 Ruby API does not expose the current axes display state, so this is a toggle button (not a checkbox).">Model axes</span>
        <button id="ctrl-ToggleAxes" class="toggle-btn">Toggle</button>
      </div>
      <label class="row">
        <span class="lbl">Section planes</span>
        <input type="checkbox" id="ctrl-DisplaySectionPlanes" data-key="DisplaySectionPlanes">
      </label>
      <label class="row">
        <span class="lbl">Section cuts</span>
        <input type="checkbox" id="ctrl-DisplaySectionCuts" data-key="DisplaySectionCuts">
      </label>
    </section>

    <footer class="ftr">
      <span id="footer-text" class="footer-link" title="Click to see all scenes using this style">—</span>
    </footer>
  </div>

  <!-- Overlay: lista scene che usano questo stile -->
  <div id="scenes-overlay" class="scenes-overlay hidden">
    <div class="scenes-overlay-box">
      <div class="scenes-overlay-hdr">
        <span>Scenes using this style</span>
        <button id="scenes-overlay-close" class="overlay-close">✕</button>
      </div>
      <ul id="scenes-overlay-list" class="scenes-overlay-list"></ul>
    </div>
  </div>

  <!-- Color picker popup (HSV square + hue slider + presets).
       Costruito custom perché <input type="color"> è broken in CEF SU 2019. -->
  <div id="sm-color-popup" class="sm-color-popup hidden">
    <div class="cp-main">
      <div id="cp-sb" class="cp-sb"><span class="cp-marker" id="cp-sb-marker"></span></div>
      <div id="cp-hue" class="cp-hue"><span class="cp-hue-marker" id="cp-hue-marker"></span></div>
    </div>
    <div class="cp-bot">
      <span id="cp-preview" class="cp-preview"></span>
      <input type="text" id="cp-hex" class="cp-hex" maxlength="7" placeholder="#aabbcc" spellcheck="false">
      <button id="cp-none" class="cp-none-btn" title="No color" style="display:none">None</button>
    </div>
    <div id="cp-recent" class="cp-recent"></div>
    <div id="cp-presets" class="cp-presets"></div>
  </div>

  <script src="js/color_popup.js"></script>
  <script src="js/style_dialog.js"></script>
</body>
</html>
