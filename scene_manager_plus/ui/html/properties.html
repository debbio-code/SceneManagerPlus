<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Scene properties</title>
  <link rel="stylesheet" href="css/properties.css">
  <link rel="stylesheet" href="css/color_popup.css">
</head>
<body>
  <div id="props-app">
    <header class="header">
      <span class="label">Scene</span>
      <span id="scene-title" class="title">—</span>
      <button id="btn-open-scenes-native" class="hdr-icon-btn" title="Open native SketchUp Scenes panel (Window → Scenes)">⧉</button>
    </header>

    <main class="body">
      <div class="row">
        <label for="prop-name">Name</label>
        <input type="text" id="prop-name" autocomplete="off" spellcheck="false">
      </div>

      <div class="row">
        <label for="prop-desc">Description</label>
        <textarea id="prop-desc" rows="3" spellcheck="false"></textarea>
      </div>

      <fieldset>
        <legend>Properties to save</legend>
        <div id="prop-flags"></div>
      </fieldset>

      <fieldset id="layers-fieldset">
        <legend>Layers in this scene</legend>
        <div class="lay-bar">
          <span id="lay-count" class="lay-count"></span>
          <span class="lay-spacer"></span>
          <button type="button" id="btn-lay-cbl" class="lay-tool" title="Color by layer: paint the model with each layer's color instead of its materials (same checkbox as the native Layers window). It is a rendering option of the model, so scenes that save Style and Fog capture it.">C</button>
          <button type="button" id="btn-lay-add" class="lay-tool" title="Add a new layer (visible everywhere, like the native Layers window)">+</button>
          <button type="button" id="btn-lay-add-here" class="lay-tool lay-tool-wide" title="Add a new layer visible ONLY in this scene: hidden in every other scene, and hidden by default in scenes created later. Works even when this scene is not the active one.">+&#128065;</button>
          <button type="button" id="btn-lay-del" class="lay-tool" title="Delete the selected layer">&minus;</button>
          <button type="button" id="btn-lay-purge" class="lay-tool lay-tool-wide" title="Delete every layer that has no geometry on it">Purge</button>
        </div>
        <div class="lay-head">
          <span class="lay-h-cur" title="Current layer: new geometry goes here">Cur</span>
          <span class="lay-h-vis" title="Visible in the model (same as the native Layers window)">Vis</span>
          <span class="lay-h-name">Name</span>
          <span class="lay-h-info" title="What is on this layer: groups, components, faces, edges…">Obj</span>
          <span class="lay-h-mv" title="Move the current model selection to this layer">Sel</span>
          <span class="lay-h-col" title="Layer color">Col</span>
          <span class="lay-h-dash" title="Line style (dashes)">Dashes</span>
        </div>
        <div id="lay-list" class="lay-list"></div>
        <div id="lay-note" class="lay-note"></div>
      </fieldset>

      <fieldset id="fog-fieldset">
        <legend>Fog</legend>
        <div class="fog-note" id="fog-activate-note" style="display:none">
          Fog is read/edited from the active scene's rendering options.
          <button id="btn-fog-activate" type="button">Activate this scene</button>
        </div>
        <label class="fog-toggle">
          <input type="checkbox" id="fog-display">
          <span>Display Fog</span>
        </label>
        <div class="fog-controls" id="fog-controls">
          <div class="fog-axis-title">Distance</div>
          <div class="fog-slider-wrap">
            <span class="fog-axis-lbl fog-axis-lbl-l">0</span>
            <div id="fog-dual" class="fog-dual">
              <div class="fog-track"></div>
              <div id="fog-fill" class="fog-fill"></div>
              <div id="fog-thumb-start" class="fog-thumb fog-thumb-start" tabindex="0">
                <span class="fog-thumb-lbl">0%</span>
              </div>
              <div id="fog-thumb-end" class="fog-thumb fog-thumb-end" tabindex="0">
                <span class="fog-thumb-lbl">100%</span>
              </div>
            </div>
            <span class="fog-axis-lbl fog-axis-lbl-r">∞</span>
          </div>
          <div class="fog-nums">
            <span class="fog-num-row">
              <span class="fog-num-lbl" title="Distance from camera where fog density is 0% (fog begins)">0% at</span>
              <button type="button" class="fog-step-btn" data-step="start" data-dir="-1" title="Decrease (hold for repeat, Shift = ×10, Ctrl = ÷10)">−</button>
              <input type="number" id="fog-num-start" class="fog-num">
              <button type="button" class="fog-step-btn" data-step="start" data-dir="+1" title="Increase (hold for repeat, Shift = ×10, Ctrl = ÷10)">+</button>
              <span class="fog-num-unit" id="fog-unit-start">in</span>
            </span>
            <span class="fog-num-row">
              <span class="fog-num-lbl" title="Distance from camera where fog density is 100% (fully opaque)">100% at</span>
              <button type="button" class="fog-step-btn" data-step="end" data-dir="-1" title="Decrease (hold for repeat, Shift = ×10, Ctrl = ÷10)">−</button>
              <input type="number" id="fog-num-end" class="fog-num">
              <button type="button" class="fog-step-btn" data-step="end" data-dir="+1" title="Increase (hold for repeat, Shift = ×10, Ctrl = ÷10)">+</button>
              <span class="fog-num-unit" id="fog-unit-end">in</span>
            </span>
          </div>
        </div>
      </fieldset>

      <div class="preview-wrap">
        <div class="preview-label">Preview</div>
        <div id="preview-box" class="preview-box">
          <div class="preview-empty">No preview generated.<br>Use the 🎬 Preview button in the main toolbar.</div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <button id="btn-update-view" title="Capture current viewport state into this scene — right-click to update only one property">
        Update from view
      </button>
      <div class="spacer"></div>
      <span id="status" class="status"></span>
    </footer>
  </div>

  <!-- Markup del picker HSV condiviso. In CEF non si possono includere
       fragment HTML, quindi questo blocco e duplicato in ogni dialog che usa
       SMColorPopup (index.html, style.html). -->
  <div id="sm-color-popup" class="sm-color-popup hidden">
    <div class="cp-main">
      <div id="cp-sb" class="cp-sb"><span class="cp-marker" id="cp-sb-marker"></span></div>
      <div id="cp-hue" class="cp-hue"><span class="cp-hue-marker" id="cp-hue-marker"></span></div>
    </div>
    <div class="cp-bot">
      <span id="cp-preview" class="cp-preview"></span>
      <input type="text" id="cp-hex" class="cp-hex" maxlength="7" placeholder="#aabbcc" spellcheck="false">
      <button id="cp-none" class="cp-none-btn" title="No color" style="display:none">None</button>
    </div>
    <div id="cp-recent" class="cp-recent"></div>
    <div id="cp-presets" class="cp-presets"></div>
  </div>

  <script src="js/color_popup.js"></script>
  <script src="js/properties.js"></script>
</body>
</html>
